plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Credentials are supplied outside Git. Never log their values; do not pass passwords on the command line.
def setting = { String name -> providers.environmentVariable(name).orElse(providers.gradleProperty(name)).orNull }
def codeText = setting('BASTI_VERSION_CODE') ?: '1'
if (!(codeText ==~ /[0-9]{1,10}/) || codeText.toLong() < 1 || codeText.toLong() > 2100000000L) {
    throw new GradleException('BASTI_VERSION_CODE must be an integer from 1 to 2100000000')
}
def distributionCode = codeText.toInteger()
def distributionName = setting('BASTI_VERSION_NAME') ?: '1.1'
if (!(distributionName ==~ /[A-Za-z0-9][A-Za-z0-9._-]{0,79}/)) {
    throw new GradleException('BASTI_VERSION_NAME must be a short human-readable version without whitespace')
}
def signingValues = ['BASTI_KEYSTORE_PATH', 'BASTI_STORE_PASSWORD', 'BASTI_KEY_ALIAS', 'BASTI_KEY_PASSWORD']
    .collectEntries { name -> [(name): setting(name)] }
def signingComplete = signingValues.values().every { it != null && !it.isEmpty() }

def verifyDistributionSigning = tasks.register('verifyDistributionSigning') {
    group = 'verification'
    description = 'Reject distribution packaging without explicit version and persistent signing credentials.'
    doLast {
        if (!signingComplete) throw new GradleException('Signed release requires BASTI_KEYSTORE_PATH, BASTI_STORE_PASSWORD, BASTI_KEY_ALIAS and BASTI_KEY_PASSWORD (environment or private Gradle properties).')
        if (!file(signingValues.BASTI_KEYSTORE_PATH).isFile()) throw new GradleException('The configured distribution keystore file does not exist.')
        if (setting('BASTI_VERSION_CODE') == null || distributionCode <= 1) throw new GradleException('Signed release requires explicit BASTI_VERSION_CODE greater than 1 and greater than the installed distribution version.')
    }
}
// Covers APK and bundle packaging, including direct invocation: never silently publish unsigned release.
tasks.configureEach {
    if (name in ['preReleaseBuild', 'validateSigningRelease', 'packageRelease', 'packageReleaseBundle', 'signReleaseBundle']) {
        dependsOn verifyDistributionSigning
    }
}

android {
    namespace 'com.bellfamily.bastischool'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bellfamily.bastischool'
        minSdk 23
        targetSdk 35
        versionCode distributionCode
        versionName distributionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        distribution {
            if (signingComplete) {
                storeFile file(signingValues.BASTI_KEYSTORE_PATH)
                storePassword signingValues.BASTI_STORE_PASSWORD
                keyAlias signingValues.BASTI_KEY_ALIAS
                keyPassword signingValues.BASTI_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug { versionNameSuffix '-dev' }
        release {
            signingConfig signingConfigs.distribution
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures { compose true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
}
